# Development environment: MySQL + API + Web.
# 1. cp .env.example .env and set the values (the .env file is git-ignored).
# 2. docker compose up --build
# 3. Create the first administrator (once):
#      docker compose run --rm -e REALESTATE_ADMIN_PASSWORD web create-admin --email you@example.com --name "Your Name" --company "Company"
#    (set REALESTATE_ADMIN_PASSWORD in your shell first; it is passed through, never stored)
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: realestate
      MYSQL_USER: realestate
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=realestate;User=realestate;Password=${MYSQL_APP_PASSWORD};"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set in .env (min 32 chars)}
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      FileStorage__RootPath: /var/realestate/storage
    ports:
      - "5008:8080"
    volumes:
      - document-storage:/var/realestate/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /api/v1/health HTTP/1.0\r\n\r\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=realestate;User=realestate;Password=${MYSQL_APP_PASSWORD};"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set in .env (min 32 chars)}
      REALESTATE_ADMIN_PASSWORD: ${REALESTATE_ADMIN_PASSWORD:-}
      FileStorage__RootPath: /var/realestate/storage
    ports:
      - "5080:8080"
    volumes:
      - document-storage:/var/realestate/storage

volumes:
  mysql-data:
  document-storage:
